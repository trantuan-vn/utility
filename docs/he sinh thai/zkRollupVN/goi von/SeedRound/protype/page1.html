<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AVAX-USD Trading - dYdX Style</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f12;
      color: #ffffff;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #1c1e23;
      border-bottom: 1px solid #2d2f36;
    }
    header .logo {
      font-weight: bold;
      color: #f55353;
    }
    header nav a {
      margin: 0 12px;
      color: #ccc;
      text-decoration: none;
    }
    .container {
      display: flex;
      height: calc(100vh - 50px);
    }
    .chart {
      flex: 2;
      padding: 15px;
      border-right: 1px solid #2d2f36;
    }
    .order-book {
      flex: 1;
      padding: 15px;
      border-right: 1px solid #2d2f36;
    }
    .trade-panel {
      flex: 1;
      padding: 15px;
      background-color: #16171c;
    }
    .section-title {
      margin-bottom: 10px;
      font-size: 16px;
      font-weight: bold;
    }
    .connect-wallet {
      background-color: #3a3f4b;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      margin-top: 30px;
    }
    button.connect {
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #4e5eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .market-depth {
      font-size: 14px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    .depth-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .buy {
      color: #00d395;
    }
    .sell {
      color: #ff4d4d;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">dYdX</div>
    <nav>
      <a href="#">Trade</a>
      <a href="#">Markets</a>
      <a href="#">Portfolio</a>
      <a href="#">Vault</a>
      <a href="#">More</a>
    </nav>
  </header>

  <div class="container">
    <!-- Chart Panel -->
    <div class="chart">
      <div class="section-title">AVAX-USD Chart</div>
      <!-- You can embed TradingView widget here -->
      <div class="tradingview-widget-container" style="height: 600px; width: 100%;">
        <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
          "autosize": false,
          "height": 600,
          "width": "100%",
          "symbol": "NASDAQ:AAPL",
          "interval": "D",
          "timezone": "Etc/UTC",
          "theme": "dark",
          "style": "1",
          "hide_top_toolbar": false,
          "hide_side_toolbar": true,
          "allow_symbol_change": true,
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <!-- Order Book Panel -->
    <div class="order-book">
      <div class="section-title">Order Book</div>
      <div class="market-depth">
        <div class="depth-row sell"><span>24.15</span><span>8.1K</span></div>
        <div class="depth-row sell"><span>24.10</span><span>5.8K</span></div>
        <div class="depth-row buy"><span>24.00</span><span>3.1K</span></div>
        <div class="depth-row buy"><span>23.95</span><span>4.6K</span></div>
        <!-- Add more rows dynamically -->
      </div>
    </div>

    <!-- Trade Panel -->
    <div class="trade-panel">
      <div class="section-title">Trade</div>
      <form>
        <label>Order Type:</label><br/>
        <select>
          <option>Market</option>
          <option>Limit</option>
        </select><br/><br/>

        <label>Amount (AVAX):</label><br/>
        <input type="number" placeholder="0.0" /><br/><br/>

        <label>Leverage:</label><br/>
        <input type="range" min="1" max="10" value="1" /><br/><br/>

        <button type="submit" style="width: 100%; background: #00d395; padding: 10px; border: none; border-radius: 4px;">Buy | Long</button>
      </form>

      <div class="connect-wallet">
        <div>Not connected</div>
        <button class="connect">Connect Wallet</button>
      </div>
    </div>
  </div>
</body>
</html>
