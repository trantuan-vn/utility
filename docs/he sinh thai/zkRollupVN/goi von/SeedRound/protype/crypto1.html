<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TradingVista</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f2f5;
      color: #333;
      transition: background-color 0.3s, color 0.3s;
    }
    header {
      background-color: white;
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      color: #0073e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      border: 1px solid #ccc;
      background: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }
    .section {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 20px;
    }
    .section h2 {
      margin: 0 0 15px 0;
      font-size: 20px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .half {
      flex: 1;
      min-width: 300px;
    }
    iframe, .tradingview-widget-container {
      width: 100% !important;
    }
    footer {
      text-align: center;
      font-size: 13px;
      color: gray;
      margin: 40px 0;
    }
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
    /* DARK MODE */
    .dark-mode {
      background-color: #121212;
      color: #eee;
    }

    .dark-mode header {
      background-color: #1f1f1f;
      color: #eee;
      border-bottom: 1px solid #444;
    }

    .dark-mode .section {
      background-color: #1e1e1e;
      border-color: #444;
    }

    .dark-mode .btn {
      background-color: #2a2a2a;
      color: #eee;
      border-color: #555;
    }    
 
    .dark-mode .search-box {
      background-color: #2a2a2a;
      color: #eee;
      border-color: #555;
    }
  </style>
</head>
<body>

<header>
  TradingVista
  
  <div class="actions">
    <input class="search-box" type="text" placeholder="Search crypto/token/ntf symbol...">
    <select id="languageSelect" class="btn">
      <option value="en">🇺🇸 English</option>
      <option value="vi_VN">🇻🇳 Tiếng Việt</option>
    </select>
    <button id="themeToggle" class="btn">🌙 Dark Mode</button>
  </div>
</header>

<nav>
  <div class="tradingview-widget-container" id="ticker-tape"></div>
</nav>

<div class="container">
  <div class="section">
    <h2>Symbol Info</h2>
    <div class="tradingview-widget-container" id="symbol-info"></div>
  </div>

  <div class="section">
    <h2>Advanced Chart</h2>
    <div class="tradingview-widget-container" id="advanced-chart" style="height: 600px; width: 100%;"></div>
  </div>

  <div class="section">
    <h2>Company Profile</h2>
    <div class="tradingview-widget-container" id="company-profile"></div>
  </div>

  <div class="row">
    <div class="section half">
      <h2>Technical Analysis</h2>
      <div class="tradingview-widget-container" id="technical-analysis"></div>
    </div>

    <div class="section half">
      <h2>Top Stories</h2>
      <div class="tradingview-widget-container" id="top-stories"></div>
    </div>
  </div>

  <div class="section">
    <div class="tradingview-widget-container" id="crypto-coins-heatmap" style="height: 600px; width: 100%;"></div>
  </div>

  <div class="section">
    <div class="tradingview-widget-container" id="cryptocurrency-market" style="height: 550px; width: 100%;"></div>
  </div>

</div>

<footer>
  &copy; 2025 TradingVista UI – Built with TradingView Widgets
</footer>

<script>
  let widgetLocale = 'en';
  let widgetTheme = 'light';

  const loadWidgets = () => {
    document.getElementById('ticker-tape').innerHTML = '';
    document.getElementById('symbol-info').innerHTML = '';
    document.getElementById('advanced-chart').innerHTML = '';
    document.getElementById('company-profile').innerHTML = '';
    document.getElementById('technical-analysis').innerHTML = '';
    document.getElementById('top-stories').innerHTML = '';
    document.getElementById('crypto-coins-heatmap').innerHTML = '';
    document.getElementById('cryptocurrency-market').innerHTML = '';

    const createScript = (id, src, config) => {
      const container = document.getElementById(id);
      const script = document.createElement('script');
      script.src = src;
      script.async = true;
      script.innerHTML = JSON.stringify(config);
      container.appendChild(document.createElement('div')).className = "tradingview-widget-container__widget";
      container.appendChild(script);
    };

    createScript("ticker-tape", "https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js", {
      symbols: [
        { proName: "BITSTAMP:XRPUSD", title: "Ripple" },
        { proName: "BITSTAMP:SOLUSD", title: "Solana" },
        { proName: "BINANCE:BNBUSD", title: "Binance" },
        { proName: "BITSTAMP:BTCUSD", title: "Bitcoin" },
        { proName: "BITSTAMP:ETHUSD", title: "Ethereum" }
      ],
      colorTheme: widgetTheme,
      locale: widgetLocale,
      isTransparent: false,
      displayMode: "adaptive",
      showSymbolLogo: true
    });

    createScript("symbol-info", "https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js", {
      symbol: "BITSTAMP:BTCUSD",
      colorTheme: widgetTheme,
      isTransparent: false,
      locale: widgetLocale
    });

    createScript("advanced-chart", "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js", {
      autosize: true,
      height: 600,
      width: "100%",
      symbol: "BITSTAMP:BTCUSD",
      interval: "D",
      timezone: "Etc/UTC",
      theme: widgetTheme,
      style: "1",
      hide_top_toolbar: false,
      hide_side_toolbar: false,
      allow_symbol_change: true,
      locale: widgetLocale,
      // ➕ Thêm các dòng sau để hiển thị watchlist:
      watchlist: [
        "BITSTAMP:BTCUSD",
        "BITSTAMP:ETHUSD",
        "BINANCE:BNBUSD",
        "BITSTAMP:SOLUSD",
        "BINANCE:AVAXUSDT"
      ],
      details: true, // hiện thông tin chi tiết của symbol
      hotlist: true  // hiện bảng hotlist bên phải      
    });

    createScript("company-profile", "https://s3.tradingview.com/external-embedding/embed-widget-symbol-profile.js", {
      symbol: "BITSTAMP:BTCUSD",
      colorTheme: widgetTheme,
      isTransparent: false,
      locale: widgetLocale,
      height: 350
    });

    createScript("technical-analysis", "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js", {
      symbol: "BITSTAMP:BTCUSD",
      interval: "1m",
      showIntervalTabs: true,
      colorTheme: widgetTheme,
      isTransparent: false,
      locale: widgetLocale,
      width: "100%",
      height: 450
    });

    createScript("top-stories", "https://s3.tradingview.com/external-embedding/embed-widget-timeline.js", {
      feedMode: "all_symbols",
      colorTheme: widgetTheme,
      isTransparent: false,
      locale: widgetLocale,
      displayMode: "regular",
      height: 550
    });

    createScript("crypto-coins-heatmap", "https://s3.tradingview.com/external-embedding/embed-widget-crypto-coins-heatmap.js", {
      dataSource: "Crypto",
      blockSize: "market_cap_calc",
      blockColor: "24h_close_change|5",
      locale: widgetLocale,
      symbolUrl: "",
      colorTheme: widgetTheme,
      hasTopBar: false,
      isDataSetEnabled: false,
      isZoomEnabled: true,
      hasSymbolTooltip: true,
      isMonoSize: false,
      width: "100%",
      height: 600
    });


    createScript("cryptocurrency-market", "https://s3.tradingview.com/external-embedding/embed-widget-screener.js", {
      defaultColumn: "overview",
      screener_type: "crypto_mkt",
      displayCurrency: "USD",
      colorTheme: widgetTheme,
      isTransparent: false,
      locale: widgetLocale,
      width: "100%",
      height: 550
    });
  };

  document.getElementById('languageSelect').addEventListener('change', (e) => {
    widgetLocale = e.target.value;
    loadWidgets();
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const body = document.body;
    const isDark = body.classList.toggle('dark-mode');
    widgetTheme = isDark ? 'dark' : 'light';
    document.getElementById('themeToggle').textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    loadWidgets();
  });

  loadWidgets();
</script>

</body>
</html>
