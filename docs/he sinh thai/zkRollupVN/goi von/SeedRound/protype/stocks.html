<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TradingVista (https://www.tradingview.com/widget-docs/tutorials/build-page/#introduction)</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f0f2f5;
      color: #333;
    }

    header {
      background-color: white;
      padding: 15px 30px;
      font-size: 24px;
      font-weight: bold;
      color: #0073e6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .search-box {
      padding: 6px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .section {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 20px;
      padding: 20px;
    }

    .section h2 {
      margin-top: 0;
      font-size: 20px;
      margin-bottom: 15px;
      text-align: left;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .half {
      flex: 1;
      min-width: 300px;
    }

    iframe, .tradingview-widget-container {
      width: 100% !important;
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: gray;
      margin: 40px 0;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }
      .search-box {
        margin-top: 10px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <header>
    TradingVista
    <input class="search-box" type="text" placeholder="Search stock symbol...">
  </header>
  <nav>
    <!-- TradingView Ticker Tape Widget -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "FOREXCOM:SPXUSD", "title": "S&P 500" },
          { "proName": "FOREXCOM:NSXUSD", "title": "NASDAQ 100" },
          { "proName": "FX_IDC:EURUSD", "title": "EUR/USD" },
          { "proName": "BITSTAMP:BTCUSD", "title": "Bitcoin" },
          { "proName": "BITSTAMP:ETHUSD", "title": "Ethereum" }
        ],
        "colorTheme": "light",
        "locale": "en",
        "isTransparent": false,
        "displayMode": "adaptive",
        "showSymbolLogo": true
      }
      </script>
    </div>
  </nav>
  <div class="container">
    <div class="section">
      <h2>Symbol Info</h2>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js" async>
        {
          "symbol": "NASDAQ:AAPL",
          "colorTheme": "light",
          "isTransparent": false,
          "locale": "en"
        }
        </script>
      </div>
    </div>

    <div class="section">
      <h2>Advanced Chart</h2>
      <div class="tradingview-widget-container" style="height: 600px; width: 100%;">
        <div class="tradingview-widget-container__widget" style="height: 100%; width: 100%;"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
        {
          "autosize": false,
          "height": 600,
          "width": "100%",
          "symbol": "NASDAQ:AAPL",
          "interval": "D",
          "timezone": "Etc/UTC",
          "theme": "light",
          "style": "1",
          "hide_top_toolbar": false,
          "hide_side_toolbar": true,
          "allow_symbol_change": true,
          "locale": "en"
        }
        </script>
      </div>
    </div>


    <div class="section">
      <h2>Company Profile</h2>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-profile.js" async>
        {
          "symbol": "NASDAQ:AAPL",
          "colorTheme": "light",
          "isTransparent": false,
          "locale": "en",
          "height": 350
        }
        </script>
      </div>
    </div>

    <div class="section">
      <h2>Fundamental Data</h2>
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script src="https://s3.tradingview.com/external-embedding/embed-widget-financials.js" async>
        {
          "symbol": "NASDAQ:AAPL",
          "colorTheme": "light",
          "displayMode": "regular",
          "isTransparent": false,
          "locale": "en",
          "height": 550
        }
        </script>
      </div>
    </div>

    <div class="row">
      <div class="section half">
        <h2>Technical Analysis</h2>
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
          {
            "symbol": "NASDAQ:AAPL",
            "interval": "1m",
            "showIntervalTabs": true,
            "colorTheme": "light",
            "isTransparent": false,
            "locale": "en",
            "width": "100%",
            "height": 450
          }
          </script>
        </div>
      </div>

      <div class="section half">
        <h2>Top Stories</h2>
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
          {
            "feedMode": "all_symbols",
            "colorTheme": "light",
            "isTransparent": false,
            "locale": "en",
            "displayMode": "regular",
            "height": 550
          }
          </script>
        </div>
      </div>
    </div>
  </div>

  <footer>
    This example is part of a tutorial on integrating TradingView widgets.<br/>
    &copy; 2025 TradingVista Example UI
  </footer>

</body>
</html>
